# TRANSITIONAL compose for migrating janata's live MinIO data to SeaweedFS.
# Use this ONLY as a one-time deploy step, then switch janata back to
# docker-compose.coolify.yaml once scripts/migrate-minio-to-seaweedfs.sh reports
# CHECK_PASSED (see the result file it writes: /s3/shacky-media/_migration-check/result.txt,
# publicly fetchable through the site's existing /s3/ proxy).
#
# api/web are UNCHANGED here — still pointed at the old "minio" service — so the
# live site keeps working exactly as before while the migration runs in the
# background. Delete this file once the migration is complete and janata has
# cut over.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jap_password}
      POSTGRES_DB: ${POSTGRES_DB:-shacky_cms}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-jap} -d ${POSTGRES_DB:-shacky_cms}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # OLD storage — untouched, still serving the live site. pull_policy: never because
  # minio/minio is no longer pullable at all; this reuses the image already cached
  # on the host from when janata was first deployed.
  minio:
    image: minio/minio:latest
    pull_policy: never
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 10

  # NEW storage target — fresh, empty SeaweedFS on its own volume.
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: server -dir=/data -ip=seaweedfs -master.port=9333 -volume.port=8080 -filer -filer.port=8888 -s3 -s3.port=9000
    volumes:
      - seaweed_data:/data

  seaweedfs_init:
    image: amazon/aws-cli:latest
    restart: 'no'
    depends_on:
      seaweedfs:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      i=0;
      while [ $$i -lt 30 ]; do
        aws --endpoint-url http://seaweedfs:9000 s3 mb s3://shacky-media;
        aws --endpoint-url http://seaweedfs:9000 s3api head-bucket --bucket shacky-media 2>/dev/null && exit 0;
        echo 'shacky-media bucket not ready yet, retrying...';
        i=$$((i+1));
        sleep 2;
      done;
      echo 'FAILED to create shacky-media bucket after 60s of retries';
      exit 1;
      "
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_DEFAULT_REGION: us-east-1

  # One-shot: copies every object from the old bucket to the new one via a local
  # staging directory (download then upload — aws-cli only talks to one endpoint
  # per invocation), verifies the copy, and writes a result file back into the OLD
  # bucket for easy checking. Uses aws-cli, not rclone: rclone hung with zero
  # output against this exact bucket for reasons never root-caused, while a
  # minimal aws-cli diagnostic reached it from a fresh container in seconds.
  migrate_to_seaweedfs:
    image: amazon/aws-cli:latest
    restart: 'no'
    depends_on:
      minio:
        condition: service_healthy
      seaweedfs_init:
        condition: service_completed_successfully
    volumes:
      - staging_data:/staging
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_DEFAULT_REGION: us-east-1
      OLD_S3_ENDPOINT: http://minio:9000
      NEW_S3_ENDPOINT: http://seaweedfs:9000
      S3_BUCKET: shacky-media
    # Inline rather than a mounted script file — every prior migration attempt
    # (rclone-based and aws-cli-based alike) produced zero output at all, including
    # from steps with their own short timeouts, which a bad bind-mount path would
    # also explain (unlike seaweedfs_init's inline /bin/sh -c, this service's mount
    # was never independently confirmed to work). Inlining removes that variable.
    entrypoint: >
      /bin/sh -c "
      RESULT=/tmp/result.txt;
      mkdir -p /staging;
      echo 'Migration started: '$$(date -u +%Y-%m-%dT%H:%M:%SZ) > $$RESULT;
      echo '--- source (old) summary ---' >> $$RESULT;
      timeout 60 aws --endpoint-url $$OLD_S3_ENDPOINT s3 ls s3://$$S3_BUCKET --recursive --summarize >> $$RESULT 2>&1 || echo '(could not summarize old bucket)' >> $$RESULT;
      timeout 45 aws --endpoint-url $$OLD_S3_ENDPOINT s3 cp $$RESULT s3://$$S3_BUCKET/_migration-check/result.txt >> $$RESULT 2>&1;
      echo '--- downloading old -> /staging ---' >> $$RESULT;
      if timeout 1200 aws --endpoint-url $$OLD_S3_ENDPOINT s3 sync s3://$$S3_BUCKET /staging >> $$RESULT 2>&1; then echo DOWNLOAD_OK >> $$RESULT; else echo DOWNLOAD_FAILED >> $$RESULT; fi;
      timeout 45 aws --endpoint-url $$OLD_S3_ENDPOINT s3 cp $$RESULT s3://$$S3_BUCKET/_migration-check/result.txt >> $$RESULT 2>&1;
      echo '--- uploading /staging -> new ---' >> $$RESULT;
      if timeout 1200 aws --endpoint-url $$NEW_S3_ENDPOINT s3 sync /staging s3://$$S3_BUCKET >> $$RESULT 2>&1; then echo UPLOAD_OK >> $$RESULT; STATUS=0; else echo UPLOAD_FAILED >> $$RESULT; STATUS=1; fi;
      timeout 45 aws --endpoint-url $$OLD_S3_ENDPOINT s3 cp $$RESULT s3://$$S3_BUCKET/_migration-check/result.txt >> $$RESULT 2>&1;
      echo '--- destination (new) summary ---' >> $$RESULT;
      timeout 60 aws --endpoint-url $$NEW_S3_ENDPOINT s3 ls s3://$$S3_BUCKET --recursive --summarize >> $$RESULT 2>&1 || echo '(could not summarize new bucket)' >> $$RESULT;
      echo 'Migration finished: '$$(date -u +%Y-%m-%dT%H:%M:%SZ) >> $$RESULT;
      timeout 45 aws --endpoint-url $$OLD_S3_ENDPOINT s3 cp $$RESULT s3://$$S3_BUCKET/_migration-check/result.txt >> $$RESULT 2>&1;
      cat $$RESULT;
      exit $$STATUS;
      "

  # UNCHANGED — still serving from the old "minio" service throughout this phase.
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgresql://jap:jap_password@postgres:5432/shacky_cms}
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: shacky-media
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      APP_URL: ${APP_URL}
      API_URL: ${API_URL}
      CORS_ORIGIN: ${APP_URL}
    healthcheck:
      test: ['CMD', 'node', '-e', 'require("http").get("http://127.0.0.1:4000/health",(r)=>{process.exit(r.statusCode<400?0:1)}).on("error",()=>process.exit(1))']
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://api:4000
        API_INTERNAL_URL: http://api:4000
        MINIO_INTERNAL_URL: http://minio:9000
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: '3000'
      API_INTERNAL_URL: http://api:4000
      MINIO_INTERNAL_URL: http://minio:9000

volumes:
  postgres_data:
  redis_data:
  minio_data:
  seaweed_data:
  staging_data:
