name: E2E

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shacky
          POSTGRES_PASSWORD: shacky
          POSTGRES_DB: shacky_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U shacky"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      CI: 'true'
      NODE_ENV: test
      DATABASE_URL: postgresql://shacky:shacky@localhost:5432/shacky_e2e
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: e2e-access-secret-e2e-access-secret-0123
      JWT_REFRESH_SECRET: e2e-refresh-secret-e2e-refresh-secret-012
      APP_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:3000
      API_INTERNAL_URL: http://localhost:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      SEED_ADMIN_EMAIL: admin@shacky.local
      SEED_ADMIN_PASSWORD: ChangeMe@123!

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @shacky/e2e exec playwright install --with-deps chromium

      - name: Migrate and seed database
        working-directory: apps/api
        run: |
          pnpm prisma migrate deploy
          pnpm exec tsx prisma/seed.ts

      - name: Build shared, api and web
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Run Playwright tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
